<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<title>Offline | Blueprint</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    background: #f6f9fc; color: #232a3b;
    font: 16px/1.5 Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    text-align: center;
  }
  main { max-width: 340px; }
  img { width: 168px; height: auto; margin-bottom: 28px; }
  h1 { margin: 0 0 8px; font-size: 1.15rem; font-weight: 700; }
  p { margin: 0 0 24px; color: #4a5266; }
  button {
    font: inherit; font-weight: 600; color: #fff; background: #264fa0; border: 0;
    border-radius: 10px; padding: 12px 22px; min-height: 44px; cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <img src="/brand/logo-header-navy.svg" alt="Blueprint Marketing">
  <h1>You are offline</h1>
  <p>Blueprint needs a connection to show your calendar and content. Nothing has been lost.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
